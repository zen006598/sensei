services:
  sensei:
    image: ghcr.io/zen006598/sensei:latest
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ANKIWEB_EMAIL=${ANKIWEB_EMAIL}
      - ANKIWEB_PASSWORD=${ANKIWEB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - ANKI_COLLECTION_PATH=/data/anki/collection.anki2
      - SCHEDULER_DAILY_HOUR=8
      - MAX_CARDS_PER_SESSION=20
      - GEMINI_TIMEOUT=30
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DB_PATH=/data/db/sensei.db
      - LOG_LEVEL=ERROR
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - anki_data:/data/anki
      - sensei_db:/data/db

volumes:
  anki_data:
  sensei_db:
