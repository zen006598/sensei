services:
  sensei:
    image: ghcr.io/zen006598/sensei:latest
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ANKIWEB_EMAIL=${ANKIWEB_EMAIL}
      - ANKIWEB_PASSWORD=${ANKIWEB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_CLASSIFY_MODEL=${GEMINI_CLASSIFY_MODEL:-gemini-3-flash-lite}
      - ANKI_COLLECTION_PATH=/data/anki/collection.anki2
      - SCHEDULER_DAILY_HOUR=3
      - MAX_CARDS_PER_SESSION=20
      - GEMINI_TIMEOUT=30
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - DB_PATH=/data/db/sensei.db
      - LOG_LEVEL=WARNING
      - TTS_DAILY_HOUR=4
      - PIPER_VOICE_PATH=/data/piper/en_US-libritts-high.onnx
      - PIPER_VOICE=en_US-libritts-high
      - TTS_SOUND_FIELD=Sound
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - anki_data:/data/anki
      - sensei_db:/data/db
      # rw: the bot itself populates this volume at startup via
      # TTSGenerator.ensure_voice_available() (piper's downloader). Was :ro
      # back when an external script was the only writer.
      - piper_models:/data/piper

volumes:
  anki_data:
  sensei_db:
  piper_models:
