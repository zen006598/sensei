name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - '.python-version'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Security audit
        # PYSEC-2026-89: DoS in python-markdown (transitive via anki). No fixed
        # release yet; sensei only parses its own trusted card content. Remove
        # this --ignore-vuln once anki/markdown ships a fixed version.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-89

      - name: Tests
        run: uv run pytest -q

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Connect Tailscale
        uses: tailscale/github-action@v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: docker-compose.yml
          target: ~/sensei

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ANKIWEB_EMAIL: ${{ secrets.ANKIWEB_EMAIL }}
          ANKIWEB_PASSWORD: ${{ secrets.ANKIWEB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          envs: TELEGRAM_TOKEN,ANKIWEB_EMAIL,ANKIWEB_PASSWORD,GEMINI_API_KEY,GEMINI_MODEL,ALLOWED_USER_IDS
          script: |
            mkdir -p ~/sensei
            {
              printf 'TELEGRAM_TOKEN=%s\n' "$TELEGRAM_TOKEN"
              printf 'ANKIWEB_EMAIL=%s\n' "$ANKIWEB_EMAIL"
              printf 'ANKIWEB_PASSWORD=%s\n' "$ANKIWEB_PASSWORD"
              printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
              printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"
              printf 'ALLOWED_USER_IDS=%s\n' "$ALLOWED_USER_IDS"
            } > ~/sensei/.env
            cd ~/sensei
            docker compose pull
            docker compose down --remove-orphans || true
            docker compose up -d
