name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Security audit
        # PYSEC-2026-89: DoS in python-markdown (transitive via anki). No fixed
        # release yet; sensei only parses its own trusted card content. Remove
        # this --ignore-vuln once anki/markdown ships a fixed version.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-89

      - name: Tests
        run: uv run pytest -q
