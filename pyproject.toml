[project]
name = "sensei"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anki==25.9.4",
    "beautifulsoup4==4.12.3",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]==22.7",
    "rapidfuzz>=3.0.0",
    "sqlmodel>=0.0.38",
    "structlog==24.4.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
